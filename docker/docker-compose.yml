networks:
  vault_network:
    name: vault_network
    driver: bridge

volumes:
  postgres_data:
    name: vault_postgres_data
  redis_data:
    name: vault_redis_data

services:
  redis:
    image: redis:7-alpine
    container_name: vault_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vault_network

  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: vault_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vault_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vault_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-vault_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vault_user} -d ${POSTGRES_DB:-vault_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vault_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: vault_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vault_user}:${POSTGRES_PASSWORD:-vault_secure_password}@db:5432/${POSTGRES_DB:-vault_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-105470440264-7ep9hin2tddk14jba8agmbddbcl6j12r.apps.googleusercontent.com}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-super-secure-random-secret-key-in-prod}
      CHROMA_HOST: localhost
      CHROMA_PORT: 8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ../backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vault_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: vault_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks:
      - vault_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: vault_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      - backend
      - frontend
    networks:
      - vault_network
