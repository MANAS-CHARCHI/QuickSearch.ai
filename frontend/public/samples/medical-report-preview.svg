<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <filter id="mShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect x="15" y="15" width="570" height="370" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#mShadow)" />

  <!-- Clinic Header -->
  <g transform="translate(35, 35)">
    <!-- Red Cross Caduceus symbol -->
    <rect x="0" y="8" width="28" height="10" fill="#0284C7" rx="2" />
    <rect x="9" y="-1" width="10" height="28" fill="#0284C7" rx="2" />

    <text x="40" y="12" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">APOLLO HEALTH &amp; DIAGNOSTICS</text>
    <text x="40" y="26" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Comprehensive Pathology &amp; Clinical Blood Panel Report</text>
    <text x="530" y="12" font-family="monospace" font-size="10" font-weight="600" fill="#0284C7" text-anchor="end">REF: #MED-2026-9921</text>
  </g>

  <line x1="35" y1="75" x2="565" y2="75" stroke="#E2E8F0" stroke-width="1.2" />

  <!-- Patient Info Strip -->
  <g transform="translate(35, 95)" font-family="system-ui, sans-serif" font-size="10">
    <text x="0" y="0" fill="#64748B">PATIENT NAME:</text>
    <text x="90" y="0" font-weight="bold" fill="#0F172A">Alex M. Sharma (34 Y / Male)</text>

    <text x="320" y="0" fill="#64748B">SAMPLE DATE:</text>
    <text x="400" y="0" font-weight="bold" fill="#0F172A">02 Nov 2026</text>

    <text x="0" y="20" fill="#64748B">CONSULTANT:</text>
    <text x="90" y="20" font-weight="bold" fill="#0F172A">Dr. P. Sen, MD (Cardiology)</text>

    <text x="320" y="20" fill="#64748B">STATUS:</text>
    <text x="400" y="20" font-weight="bold" fill="#16A34A">FINAL VERIFIED</text>
  </g>

  <!-- Table Header -->
  <g transform="translate(35, 140)">
    <rect x="0" y="0" width="530" height="26" fill="#F1F5F9" rx="4" />
    <text x="12" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#475569">TEST DESCRIPTION</text>
    <text x="240" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#475569">OBSERVED VALUE</text>
    <text x="360" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#475569">REFERENCE RANGE</text>
    <text x="480" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#475569">STATUS</text>
  </g>

  <!-- Table Rows -->
  <g transform="translate(35, 175)" font-family="system-ui, sans-serif" font-size="10">
    <!-- Row 1 -->
    <text x="12" y="15" fill="#1E293B">Hemoglobin (Hb)</text>
    <text x="240" y="15" font-weight="bold" fill="#0F172A">14.8 g/dL</text>
    <text x="360" y="15" fill="#64748B">13.0 - 17.0</text>
    <rect x="475" y="4" width="45" height="16" rx="3" fill="#DCFCE7" />
    <text x="497" y="16" font-size="9" font-weight="bold" fill="#16A34A" text-anchor="middle">NORMAL</text>
    <line x1="0" y1="26" x2="530" y2="26" stroke="#F1F5F9" />

    <!-- Row 2 -->
    <text x="12" y="45" fill="#1E293B">Fasting Blood Sugar (Glucose)</text>
    <text x="240" y="45" font-weight="bold" fill="#0F172A">92 mg/dL</text>
    <text x="360" y="45" fill="#64748B">70 - 100</text>
    <rect x="475" y="34" width="45" height="16" rx="3" fill="#DCFCE7" />
    <text x="497" y="46" font-size="9" font-weight="bold" fill="#16A34A" text-anchor="middle">NORMAL</text>
    <line x1="0" y1="56" x2="530" y2="56" stroke="#F1F5F9" />

    <!-- Row 3 -->
    <text x="12" y="75" fill="#1E293B">Total Cholesterol</text>
    <text x="240" y="75" font-weight="bold" fill="#0F172A">185 mg/dL</text>
    <text x="360" y="75" fill="#64748B">&lt; 200</text>
    <rect x="475" y="64" width="45" height="16" rx="3" fill="#DCFCE7" />
    <text x="497" y="76" font-size="9" font-weight="bold" fill="#16A34A" text-anchor="middle">OPTIMAL</text>
    <line x1="0" y1="86" x2="530" y2="86" stroke="#F1F5F9" />

    <!-- Row 4 -->
    <text x="12" y="105" fill="#1E293B">Vitamin D3 (25-Hydroxy)</text>
    <text x="240" y="105" font-weight="bold" fill="#D97706">28.4 ng/mL</text>
    <text x="360" y="105" fill="#64748B">30.0 - 100.0</text>
    <rect x="475" y="94" width="45" height="16" rx="3" fill="#FEF3C7" />
    <text x="497" y="106" font-size="9" font-weight="bold" fill="#D97706" text-anchor="middle">MILD LOW</text>
  </g>

  <!-- Doctor Stamp and Signature -->
  <g transform="translate(420, 310)">
    <ellipse cx="60" cy="25" rx="55" ry="22" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="3 2" />
    <text x="60" y="22" font-family="'Brush Script MT', cursive, sans-serif" font-size="14" fill="#1E40AF" text-anchor="middle">Dr. P. Sen</text>
    <text x="60" y="36" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#2563EB" text-anchor="middle">VERIFIED LAB SIGNATURE</text>
  </g>

  <g transform="translate(35, 345)" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">
    <text x="0" y="0">Stored in Personal Vault City with AES-256 encryption. Indexed for AI retrieval.</text>
  </g>
</svg>
