<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="authShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="15" y="15" width="430" height="350" rx="16" fill="url(#cardGrad)" stroke="#27272A" stroke-width="1.2" filter="url(#authShadow)" />

  <!-- Code Editor Window Header -->
  <g transform="translate(32, 32)">
    <circle cx="0" cy="0" r="4.5" fill="#EF4444" />
    <circle cx="14" cy="0" r="4.5" fill="#F59E0B" />
    <circle cx="28" cy="0" r="4.5" fill="#10B981" />
    <text x="60" y="3" font-family="'Geist Mono', monospace" font-size="11" fill="#71717A">@vault.city/client.ts</text>
  </g>

  <line x1="15" y1="52" x2="445" y2="52" stroke="#27272A" stroke-width="1" />

  <!-- Code Syntax Block -->
  <g transform="translate(32, 85)" font-family="'Geist Mono', 'JetBrains Mono', monospace" font-size="12" letter-spacing="0.2">
    <!-- Line 1: Import -->
    <text x="0" y="0">
      <tspan fill="#C084FC">import</tspan>
      <tspan fill="#F4F4F5"> { vault } </tspan>
      <tspan fill="#C084FC">from</tspan>
      <tspan fill="#34D399"> "@vault.city"</tspan>
      <tspan fill="#71717A">;</tspan>
    </text>

    <!-- Line 2: Empty -->
    <!-- Line 3: Comment -->
    <text x="0" y="32" fill="#52525B" font-style="italic">
      // Zero-knowledge personal document store
    </text>

    <!-- Line 4: Call -->
    <text x="0" y="58">
      <tspan fill="#C084FC">const</tspan>
      <tspan fill="#60A5FA"> doc</tspan>
      <tspan fill="#F4F4F5"> = </tspan>
      <tspan fill="#C084FC">await</tspan>
      <tspan fill="#F4F4F5"> vault.</tspan>
      <tspan fill="#38BDF8">get</tspan>
      <tspan fill="#F4F4F5">({</tspan>
    </text>

    <text x="18" y="80">
      <tspan fill="#F4F4F5">type: </tspan>
      <tspan fill="#34D399">"Passport"</tspan>
      <tspan fill="#71717A">,</tspan>
    </text>
    <text x="18" y="102">
      <tspan fill="#F4F4F5">decrypt: </tspan>
      <tspan fill="#F472B6">true</tspan>
      <tspan fill="#71717A">,</tspan>
    </text>
    <text x="0" y="124" fill="#F4F4F5">});</text>

    <!-- Line 5: Output comment -->
    <text x="0" y="156">
      <tspan fill="#C084FC">console</tspan>
      <tspan fill="#F4F4F5">.</tspan>
      <tspan fill="#38BDF8">log</tspan>
      <tspan fill="#F4F4F5">(doc.expiryDate);</tspan>
    </text>

    <text x="0" y="186" fill="#10B981" font-weight="600">
      <tspan fill="#52525B">// =&gt; </tspan>
      <tspan fill="#10B981">"2032-10-24" (Valid)</tspan>
    </text>
  </g>

  <!-- Floating Encryption Badge (Val Town status chip) -->
  <g transform="translate(32, 310)">
    <rect x="0" y="0" width="395" height="34" rx="8" fill="#18181B" stroke="#27272A" />
    <circle cx="16" cy="17" r="4" fill="#10B981" />
    <text x="30" y="21" font-family="'Geist Mono', monospace" font-size="10" fill="#A1A1AA">AES-256 KMS &#8226; Client-Side Session &#8226; Private</text>
  </g>
</svg>
