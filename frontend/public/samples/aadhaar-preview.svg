<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="saffron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FF7700" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#0E6606" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F6F9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="15" y="15" width="570" height="350" rx="16" fill="url(#cardBg)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Security Guilloche Pattern Background -->
  <g opacity="0.04" stroke="#003366" stroke-width="1" fill="none">
    <circle cx="300" cy="190" r="40" />
    <circle cx="300" cy="190" r="70" />
    <circle cx="300" cy="190" r="100" />
    <circle cx="300" cy="190" r="130" />
    <circle cx="300" cy="190" r="160" />
  </g>

  <!-- Top Tricolor Ribbon -->
  <path d="M 15 31 A 16 16 0 0 1 31 15 L 569 15 A 16 16 0 0 1 585 31 L 585 36 L 15 36 Z" fill="url(#saffron)" />
  <rect x="15" y="36" width="570" height="4" fill="#FFFFFF" />
  <rect x="15" y="40" width="570" height="5" fill="url(#green)" />

  <!-- Header Banner -->
  <g transform="translate(35, 58)">
    <!-- Ashoka Lion Emblem Representation -->
    <path d="M 12 0 L 16 12 L 20 12 L 24 0 L 20 28 L 12 28 Z" fill="#996515" />
    <circle cx="16" cy="34" r="5" fill="none" stroke="#003366" stroke-width="1" />

    <text x="42" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1E293B">भारत सरकार</text>
    <text x="42" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B">GOVERNMENT OF INDIA</text>

    <!-- Aadhaar Sun Logo -->
    <g transform="translate(480, -5)">
      <circle cx="20" cy="20" r="14" fill="#E11D48" />
      <circle cx="20" cy="20" r="6" fill="#FFFFFF" />
      <path d="M 20 2 L 20 38 M 2 20 L 38 20 M 7 7 L 33 33 M 7 33 L 33 7" stroke="#E11D48" stroke-width="2" />
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="35" y1="105" x2="565" y2="105" stroke="#E2E8F0" stroke-width="1" />

  <!-- Photo Box -->
  <g transform="translate(40, 120)">
    <rect x="0" y="0" width="105" height="130" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- User Silhouette -->
    <circle cx="52.5" cy="48" r="24" fill="#94A3B8" />
    <path d="M 18 116 C 18 86 87 86 87 116 Z" fill="#94A3B8" />
    <!-- Hologram ribbon across photo corner -->
    <path d="M 0 100 L 30 130 L 15 130 L 0 115 Z" fill="#38BDF8" opacity="0.6" />
  </g>

  <!-- User Details -->
  <g transform="translate(165, 125)">
    <text x="0" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748B">नाम / Name</text>
    <text x="0" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">ALEX MORGAN SHARMA</text>

    <text x="0" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748B">जन्म तिथि / DOB</text>
    <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1E293B">14/08/1992</text>

    <text x="130" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748B">लिंग / Gender</text>
    <text x="130" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1E293B">MALE / पुरुष</text>

    <text x="0" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748B">Verified Biometric Vault Asset</text>
  </g>

  <!-- QR Code Mockup -->
  <g transform="translate(460, 120)">
    <rect x="0" y="0" width="100" height="100" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- QR Corner squares -->
    <rect x="10" y="10" width="24" height="24" fill="#0F172A" rx="2" />
    <rect x="15" y="15" width="14" height="14" fill="#FFFFFF" />
    <rect x="18" y="18" width="8" height="8" fill="#0F172A" />

    <rect x="66" y="10" width="24" height="24" fill="#0F172A" rx="2" />
    <rect x="71" y="15" width="14" height="14" fill="#FFFFFF" />
    <rect x="74" y="18" width="8" height="8" fill="#0F172A" />

    <rect x="10" y="66" width="24" height="24" fill="#0F172A" rx="2" />
    <rect x="15" y="71" width="14" height="14" fill="#FFFFFF" />
    <rect x="18" y="74" width="8" height="8" fill="#0F172A" />

    <!-- QR Data Matrix Dots -->
    <rect x="42" y="16" width="6" height="6" fill="#0F172A" />
    <rect x="52" y="24" width="6" height="6" fill="#0F172A" />
    <rect x="40" y="44" width="6" height="6" fill="#0F172A" />
    <rect x="54" y="44" width="6" height="6" fill="#0F172A" />
    <rect x="70" y="50" width="6" height="6" fill="#0F172A" />
    <rect x="46" y="70" width="6" height="6" fill="#0F172A" />
    <rect x="68" y="78" width="6" height="6" fill="#0F172A" />
  </g>

  <!-- Aadhaar Number (Red Highlighted, Vault Masked) -->
  <g transform="translate(40, 275)">
    <rect x="0" y="0" width="520" height="48" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="260" y="32" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="700" fill="#DC2626" text-anchor="middle" letter-spacing="4">
      9876  5432  1098
    </text>
  </g>

  <!-- Bottom Slogan Ribbon -->
  <g transform="translate(40, 340)">
    <line x1="0" y1="0" x2="520" y2="0" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="260" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#DC2626" text-anchor="middle" letter-spacing="1">
      मेरा आधार, मेरी पहचान
    </text>
  </g>
</svg>
