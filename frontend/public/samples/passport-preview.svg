<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="passportBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#F4EFE6" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="pShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Document Page Base -->
  <rect x="15" y="15" width="570" height="370" rx="14" fill="url(#passportBg)" stroke="#D4C5B0" stroke-width="1.5" filter="url(#pShadow)" />

  <!-- Security Guilloche Rosette Background -->
  <g opacity="0.06" stroke="#9A7B4F" stroke-width="0.8" fill="none">
    <ellipse cx="300" cy="200" rx="200" ry="120" />
    <ellipse cx="300" cy="200" rx="160" ry="90" />
    <ellipse cx="300" cy="200" rx="120" ry="60" />
    <circle cx="300" cy="200" r="40" />
  </g>

  <!-- Top Dark Header Band -->
  <path d="M 15 29 A 14 14 0 0 1 29 15 L 571 15 A 14 14 0 0 1 585 29 L 585 64 L 15 64 Z" fill="url(#headerGrad)" />

  <!-- Header Text -->
  <g transform="translate(35, 42)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#F1C40F" letter-spacing="2">PASSPORT / पासपोर्ट</text>
    <text x="530" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#F1C40F" text-anchor="end" letter-spacing="2">REPUBLIC OF INDIA</text>
  </g>

  <!-- Metadata Bar (Type, Code, Passport No) -->
  <g transform="translate(35, 84)" font-family="'Courier New', monospace" font-size="11">
    <text x="0" y="0" fill="#8C7A65" font-family="sans-serif" font-size="9">Type/प्रकार</text>
    <text x="0" y="15" fill="#0F172A" font-weight="bold">P</text>

    <text x="60" y="0" fill="#8C7A65" font-family="sans-serif" font-size="9">Country Code</text>
    <text x="60" y="15" fill="#0F172A" font-weight="bold">IND</text>

    <text x="180" y="0" fill="#8C7A65" font-family="sans-serif" font-size="9">Passport No. / पासपोर्ट नं.</text>
    <text x="180" y="16" fill="#DC2626" font-size="13" font-weight="bold" letter-spacing="1">Z1234567</text>
  </g>

  <line x1="35" y1="110" x2="565" y2="110" stroke="#E5D9C8" stroke-width="1" />

  <!-- Photo Box -->
  <g transform="translate(35, 120)">
    <rect x="0" y="0" width="115" height="145" rx="6" fill="#E8DEC9" stroke="#BDA789" stroke-width="1.2" />
    <circle cx="57.5" cy="55" r="26" fill="#8A7A65" />
    <path d="M 22 135 C 22 98 93 98 93 135 Z" fill="#8A7A65" />
    <!-- Ghost watermark -->
    <text x="57.5" y="142" font-family="sans-serif" font-size="8" fill="#5F5241" text-anchor="middle">OFFICIAL SCAN</text>
  </g>

  <!-- Biodata Fields -->
  <g transform="translate(170, 128)" font-family="system-ui, -apple-system, sans-serif">
    <!-- Surname -->
    <text x="0" y="0" font-size="9" fill="#8C7A65">Surname / उपनाम</text>
    <text x="0" y="15" font-size="12" font-weight="bold" fill="#0F172A" font-family="'Courier New', monospace">MORGAN</text>

    <!-- Given Names -->
    <text x="0" y="35" font-size="9" fill="#8C7A65">Given Name(s) / दिया गया नाम</text>
    <text x="0" y="50" font-size="12" font-weight="bold" fill="#0F172A" font-family="'Courier New', monospace">ALEX</text>

    <!-- Nationality & Sex -->
    <text x="0" y="70" font-size="9" fill="#8C7A65">Nationality / राष्ट्रीयता</text>
    <text x="0" y="85" font-size="11" font-weight="bold" fill="#0F172A">INDIAN</text>

    <text x="110" y="70" font-size="9" fill="#8C7A65">Sex / लिंग</text>
    <text x="110" y="85" font-size="11" font-weight="bold" fill="#0F172A">M</text>

    <text x="170" y="70" font-size="9" fill="#8C7A65">Date of Birth / जन्म तिथि</text>
    <text x="170" y="85" font-size="11" font-weight="bold" fill="#0F172A">14/08/1992</text>

    <!-- Date of Issue & Expiry -->
    <text x="0" y="105" font-size="9" fill="#8C7A65">Date of Issue / जारी करने की तिथि</text>
    <text x="0" y="120" font-size="11" font-weight="bold" fill="#0F172A">25/10/2022</text>

    <text x="170" y="105" font-size="9" fill="#8C7A65">Date of Expiry / समाप्ति की तिथि</text>
    <text x="170" y="120" font-size="12" font-weight="bold" fill="#15803D">24/10/2032</text>
  </g>

  <!-- Ghost Portrait Watermark on Right -->
  <g transform="translate(480, 140)" opacity="0.3">
    <ellipse cx="35" cy="40" rx="20" ry="24" fill="#998066" />
    <path d="M 12 95 C 12 70 58 70 58 95 Z" fill="#998066" />
    <text x="35" y="115" font-family="sans-serif" font-size="8" fill="#5F5241" text-anchor="middle">Z1234567</text>
  </g>

  <!-- Machine Readable Zone (MRZ) Optical Lines -->
  <g transform="translate(30, 310)">
    <rect x="0" y="0" width="540" height="60" rx="4" fill="#EFE8DC" stroke="#D1C3B2" stroke-width="1" />
    <text x="15" y="24" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="700" fill="#1E293B" letter-spacing="3.2">
      P&lt;INDMORGAN&lt;&lt;ALEX&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;
    </text>
    <text x="15" y="46" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="700" fill="#1E293B" letter-spacing="3.2">
      Z1234567&lt;4IND9208148M3210242&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;04
    </text>
  </g>
</svg>
