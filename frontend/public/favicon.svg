<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style><![CDATA[
    :root {
      --bg: #140E0A;
      --border: #36271D;
      --text: #FAF5F0;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #FFF5EA;
        --border: #FED7AA;
        --text: #1C1917;
      }
    }
    .bg {
      fill: var(--bg);
      stroke: var(--border);
      stroke-width: 1.5;
    }
    .text {
      fill: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Geist', 'Inter', 'Segoe UI', system-ui, sans-serif;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -1.5px;
    }
  ]]></style>

  <!-- Clean Minimal Squircle Badge -->
  <rect class="bg" x="2" y="2" width="60" height="60" rx="15"/>

  <!-- Minimalist 'vc' Typography -->
  <text class="text" x="32" y="44" text-anchor="middle">vc</text>
</svg>