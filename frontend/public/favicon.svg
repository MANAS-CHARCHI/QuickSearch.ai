<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#10B981" flood-opacity="0.5"/>
    </filter>
  </defs>
  <style><![CDATA[
    :root {
      --bg: #18181B;
      --border: #3F3F46;
      --wall: #27272A;
      --roof: #3F3F46;
      --line: #FAFAFA;
      --vault-fill: #18181B;
      --window: #18181B;
      --accent: #10B981;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #FAFAF9;
        --border: #E7E5E4;
        --wall: #F5F5F4;
        --roof: #292524;
        --line: #1C1917;
        --vault-fill: #FAFAF9;
        --window: #292524;
        --accent: #059669;
      }
    }
    .bg { fill: var(--bg); stroke: var(--border); stroke-width: 1.5; }
    .stroke { stroke: var(--line); stroke-linecap: round; stroke-linejoin: round; }
    .roof { fill: var(--roof); }
    .wall { fill: var(--wall); }
    .vault-door { fill: var(--vault-fill); stroke: var(--line); stroke-width: 2.4; }
    .window { fill: var(--window); }
    .accent { fill: var(--accent); }
  ]]></style>

  <!-- Squircle Base -->
  <rect class="bg" x="3" y="3" width="58" height="58" rx="14"/>

  <!-- Chimney -->
  <rect x="39" y="11" width="5.5" height="9" rx="1" class="wall stroke" stroke-width="2"/>
  <line x1="38" y1="11" x2="45.5" y2="11" class="stroke" stroke-width="2"/>

  <!-- Pitched Roof -->
  <polygon points="32,9 13,24 51,24" class="roof stroke" stroke-width="2.5"/>

  <!-- Spire & Security Beacon -->
  <line x1="32" y1="3.5" x2="32" y2="9" class="stroke" stroke-width="2"/>
  <circle cx="32" cy="3.5" r="2.2" class="accent" filter="url(#emeraldGlow)"/>

  <!-- Main Archive Wall -->
  <rect x="15.5" y="24" width="33" height="30" rx="1.5" class="wall stroke" stroke-width="2.4"/>

  <!-- Cobblestone Plinth Step -->
  <line x1="12" y1="54" x2="52" y2="54" class="stroke" stroke-width="2.5"/>

  <!-- Upper Archive Windows -->
  <rect x="19.5" y="28.5" width="4.5" height="6.5" rx="1.5" class="window"/>
  <rect x="40" y="28.5" width="4.5" height="6.5" rx="1.5" class="window"/>

  <!-- Circular Vault Safe Door -->
  <circle cx="32" cy="42" r="9.5" class="vault-door"/>

  <!-- 4 Locking Bolts / Dial Handles -->
  <line x1="32" y1="33" x2="32" y2="51" class="stroke" stroke-width="2.2"/>
  <line x1="23" y1="42" x2="41" y2="42" class="stroke" stroke-width="2.2"/>

  <!-- Dial Hub & Glowing Security Core -->
  <circle cx="32" cy="42" r="4.2" class="accent"/>
  <!-- Keyhole slot -->
  <circle cx="32" cy="42" r="1.6" fill="#18181B"/>

  <!-- Live encryption status dot in top corner -->
  <circle cx="51" cy="13" r="3" class="accent"/>
  <circle cx="51" cy="13" r="1.3" fill="#FFFFFF"/>
</svg>