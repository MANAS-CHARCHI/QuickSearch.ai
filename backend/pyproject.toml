[project]
name = "personal-vault-backend"
version = "0.1.0"
description = "Vault City AI - FastAPI, SQLAlchemy, PostgreSQL + pgvector Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "pgvector>=0.3.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "alembic>=1.14.0",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.8.0",
    "isort>=5.13.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
dev-dependencies = [
    "black>=24.8.0",
    "isort>=5.13.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[tool.black]
line-length = 88
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | build
  | dist
  | alembic
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
skip = [".venv", "alembic"]
